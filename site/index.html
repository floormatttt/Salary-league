  window.SITE = { owner: "floormatttt", repo: "Salary-league", branch: "main", workflow: "site.yml" };
</script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#" data-go=""><span class="logo">SL</span>Salary League</a>
    <nav class="nav" id="nav">
      <a href="#contracts" data-go="contracts" data-page="contracts">Contracts</a>
      <a href="#standings" data-go="standings" data-page="standings">Standings</a>
      <a href="#stats" data-go="stats" data-page="stats">Stats</a>
      <a href="#team" data-go="team" data-page="team">Teams</a>

      <a href="#log" data-go="log" data-page="log">Transactions</a>

</header>

<main id="view"><div class="loading">Loading the league</div></main>

    <div class="sheet-body" id="card"></div>
  </div>
</div>
