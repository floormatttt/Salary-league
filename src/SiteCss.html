<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #15171c; --muted: #646b78; --line: #e3e6eb;
    --accent: #2457d6; --accent-soft: #e7eeff; --good: #157a3a; --bad: #b42318; --warn: #9a5b00;
    --chip: #eff1f4; --row-alt: #fafbfc;
    --t-cap: #157a3a; --t-first: #8a6d00; --t-second: #c2570c; --t-tax: #b42318; --t-over: #7a0f2e;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014; --card: #171a20; --text: #e7e9ee; --muted: #9aa2b1; --line: #2a2f39;
      --accent: #84a9ff; --accent-soft: #1c2742; --good: #4ade80; --bad: #f87171; --warn: #fbbf24;
      --chip: #222731; --row-alt: #1a1d24;
      --t-cap: #4ade80; --t-first: #facc15; --t-second: #fb923c; --t-tax: #f87171; --t-over: #fb7185;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%; }
  body.modal-open { overflow: hidden; }
  a { color: var(--accent); text-decoration: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1 { font-size: 22px; margin: 0; line-height: 1.2; }
  h2 { font-size: 17px; margin: 0 0 8px; }

  /* ---------- top bar ---------- */
  .top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
  .brand { font-weight: 800; font-size: 16px; white-space: nowrap; color: var(--text); }
  .nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { padding: 7px 11px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .nav a.on { background: var(--accent-soft); color: var(--accent); }
  @media (max-width: 640px) {
    .top-in { flex-wrap: wrap; gap: 4px 10px; padding: 8px 16px 6px; }
    .nav { flex-basis: 100%; margin: 0 -16px; padding: 0 12px; }
  }

  main { max-width: 1120px; margin: 0 auto; padding: 14px 16px 40px; }
  .foot { color: var(--muted); font-size: 12.5px; margin-top: 18px; text-align: center; }

  /* ---------- building blocks ---------- */
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .box > h3, h3.sec { margin: 0 0 10px; font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 2px 8px; }
  .muted { color: var(--muted); } .small { font-size: 12.5px; } .err { color: var(--bad); } .ok { color: var(--good); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .row.start { justify-content: flex-start; }
  .grow { flex: 1; min-width: 0; }
  .pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }
  .pagehead .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }

  .btn { padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 600; cursor: pointer; font-size: 14px; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.pri { color: #0b1020; } }
  .btn.danger { color: var(--bad); }
  .btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.sm { padding: 5px 9px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }

  input[type=text], input[type=search], input[type=number], input[type=password], select, textarea {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); font-size: 16px; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  label.f > input, label.f > select { color: var(--text); }
  .form { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; align-items: end; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }

  .seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: none; padding: 7px 12px; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .seg button.on { color: #0b1020; } }

  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .stat { background: var(--chip); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat span { font-size: 11.5px; color: var(--muted); }

  .chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); white-space: nowrap; font-weight: 600; }
  .tier { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); }
  .t-cap { --tc: var(--t-cap); } .t-first { --tc: var(--t-first); } .t-second { --tc: var(--t-second); }
  .t-tax { --tc: var(--t-tax); } .t-over { --tc: var(--t-over); }
  td.tot.t-cap, td.tot.t-first, td.tot.t-second, td.tot.t-tax, td.tot.t-over { color: var(--tc); background: color-mix(in srgb, var(--tc) 10%, var(--card)); }
  .flag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 6px;
    color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); vertical-align: 1px; }
  .flag.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }

  /* ---------- tables: scroll sideways, first column sticky ---------- */
  .tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
  .box .tbl { box-shadow: none; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); font-size: 13.5px; background: var(--card); }
  th { font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--line); }
  td.l, th.l { text-align: left; }
  td.c, th.c { text-align: center; }
  tr:last-child td { border-bottom: 0; }
  tr.grp td { background: var(--chip); font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 5px 9px; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
  td.name { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
  td.hl { background: var(--accent-soft); }
  .rk { display: inline-block; width: 22px; flex: none; color: var(--muted); font-weight: 700; }
  .tm { display: flex; align-items: baseline; } .tm .small { font-size: 12px; line-height: 1.2; }
  @media (max-width: 640px) {
    td.name { max-width: 150px; }
    th, td { padding: 7px 7px; }
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stat b { font-size: 15.5px; }
  }
  .fa { font-size: 11px; font-weight: 700; color: var(--muted); }
  .st { display: inline-block; font-size: 10px; font-weight: 800; padding: 0 4px; border-radius: 3px; margin-left: 3px; vertical-align: 1px;
    background: var(--chip); color: var(--muted); }
  .st.MAX, .st.SMAX { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .st.PO, .st.TO { background: var(--accent-soft); color: var(--accent); }
  .st.HOLD { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .neg { color: var(--bad); } .pos { color: var(--good); }

  .plink { background: none; border: 0; padding: 0; color: var(--text); font: inherit; cursor: pointer; text-align: left;
    text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); text-underline-offset: 3px; }
  .plink:hover { color: var(--accent); }
  a.team { color: var(--text); font-weight: 600; }
  a.team:hover { color: var(--accent); }

  .picks { display: flex; flex-wrap: wrap; gap: 6px; }
  .picks .chip { font-weight: 500; }
  .picks .chip.own { background: var(--accent-soft); color: var(--accent); }

  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60; background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .toast.bad { background: var(--bad); color: #fff; }
  .loading { color: var(--muted); padding: 18px 4px; }
  .loading::after { content: "…"; animation: dots 1.2s steps(3, end) infinite; }
  @keyframes dots { 0% { content: "."; } 33% { content: ".."; } 66% { content: "..."; } }
  .empty { color: var(--muted); padding: 10px 2px; }

  /* ---------- log ---------- */
  .ent { display: grid; grid-template-columns: 92px 1fr; gap: 4px 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .ent:last-child { border-bottom: 0; }
  .ent .d { color: var(--muted); font-size: 12.5px; }
  .ent .body > div { margin-top: 2px; font-size: 14px; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--chip); margin-right: 6px; }
  .badge.Trade { background: var(--accent-soft); color: var(--accent); }
  .badge.Add { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .badge.Drop { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  @media (max-width: 520px) { .ent { grid-template-columns: 1fr; } }

  /* ---------- trade machine ---------- */
  .tm-teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .asset { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .asset:last-child { border-bottom: 0; }
  .asset .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .asset .sal { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .asset select { font-size: 14px; padding: 4px 6px; max-width: 110px; }
  .asset.moving .nm { font-weight: 700; }
  .asset.moving { background: linear-gradient(90deg, var(--accent-soft), transparent); }
  .verdict { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
  .verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
  ul.issues { margin: 8px 0 0; padding-left: 20px; } ul.issues li { margin: 3px 0; }
  details.more summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; padding: 6px 0; }

  .vbar { display: none; }
  @media (max-width: 900px) {
    .vbar { display: flex; justify-content: space-between; align-items: center; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 30;
      padding: 12px 16px; border: 0; border-radius: 12px; font-weight: 800; font-size: 15px; color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; }
    .vbar.ok { background: var(--good); } .vbar.no { background: var(--bad); }
    .vbar span { font-weight: 600; font-size: 13.5px; }
    #tradeResult { padding-bottom: 70px; }
  }
  @media (max-width: 900px) and (prefers-color-scheme: dark) { .vbar { color: #0b1020; } }

  /* ---------- rules ---------- */
  .rules td { white-space: normal; text-align: left; vertical-align: top; min-width: 70px; }
  .rules td:first-child { font-weight: 700; position: static; box-shadow: none; }

  /* ---------- modal (player card) ---------- */
  .modal { position: fixed; inset: 0; z-index: 50; display: none; background: rgba(8, 10, 15, .55); }
  .modal.open { display: block; }
  .sheet { position: absolute; inset: 24px auto 24px 50%; transform: translateX(-50%); width: min(780px, calc(100vw - 32px));
    background: var(--bg); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .sheet-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .sheet-bar b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 24px; }
  .x { border: 0; background: var(--chip); width: 34px; height: 34px; border-radius: 999px; font-size: 20px; line-height: 1; cursor: pointer; flex: none; }
  @media (max-width: 640px) { .sheet { inset: 0; width: 100%; transform: none; border-radius: 0; } }

  /* ---------- player card (CardRender) ---------- */
  .hdr { display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .shot { width: 84px; height: 62px; flex: none; border-radius: 10px; background: var(--chip); object-fit: cover; object-position: top;
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); }
  .hdr h1 { font-size: 21px; margin: 0 0 2px; }
  .meta { color: var(--muted); font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip.team { background: var(--accent-soft); color: var(--accent); }
  .chip.inj { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .chip.elig { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .strip .stat { flex: 1 1 90px; }
  .more { margin-top: 8px; width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; }
  td.fp { font-weight: 700; color: var(--accent); }
  .res-W { color: var(--good); font-weight: 600; } .res-L { color: var(--bad); font-weight: 600; }
  .tag { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: var(--chip); color: var(--muted); margin-left: 4px; }
  .txn { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .txn:last-child { border-bottom: 0; }
  .txn .d { width: 74px; flex: none; color: var(--muted); font-size: 12.5px; }
  .parts { margin-top: 4px; font-size: 13px; } .parts div { margin-top: 2px; }
  .status { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--chip); }
  .status.MAX, .status.SMAX { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .status.PO, .status.TO { background: var(--accent-soft); color: var(--accent); }
  .status.HOLD { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  dl.bio { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
  dl.bio dt { color: var(--muted); font-size: 13px; } dl.bio dd { margin: 0; }
</style>
