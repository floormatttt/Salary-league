<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-soft: #e8efff; --good: #15803d; --bad: #b91c1c; --warn: #a16207;
    --chip: #f1f3f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e8eaee; --muted: #9aa3b2; --line: #2a2f3a;
      --accent: #7aa2ff; --accent-soft: #1d2740; --good: #4ade80; --bad: #f87171; --warn: #facc15;
      --chip: #222733;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 12px; }
  body.popup .wrap { padding: 8px 6px; }
  body.popup .hdr { padding: 10px; }
  body.popup .shot { width: 70px; height: 52px; }

  .search { display: flex; gap: 8px; margin-bottom: 12px; }
  .search input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--text); }
  .search button { padding: 10px 14px; font-size: 15px; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; font-weight: 600; }

  .hdr { display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; }
  .shot { width: 84px; height: 62px; flex: none; border-radius: 10px; background: var(--chip); object-fit: cover;
    object-position: top; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); }
  .hdr h1 { font-size: 21px; margin: 0 0 2px; line-height: 1.2; }
  .meta { color: var(--muted); font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12.5px; padding: 3px 8px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
  .chip.team { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .chip.inj { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); font-weight: 600; }
  .chip.elig { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); font-weight: 600; }

  .tabs { display: flex; gap: 4px; margin: 12px 0 10px; overflow-x: auto; scrollbar-width: none;
    position: sticky; top: 0; background: var(--bg); padding: 6px 0; z-index: 5; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1 0 auto; padding: 9px 12px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 18px 2px 8px; }
  .more { margin-top: 8px; width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .box h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .err { color: var(--bad); }

  .tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--card); position: sticky; top: 0; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; }
  tr:last-child td { border-bottom: 0; }
  td.fp { font-weight: 700; color: var(--accent); }
  td.l { text-align: left; }
  .res-W { color: var(--good); font-weight: 600; } .res-L { color: var(--bad); font-weight: 600; }
  .tag { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: var(--chip); color: var(--muted); margin-left: 4px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .stat { background: var(--chip); border-radius: 10px; padding: 8px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11.5px; color: var(--muted); }

  .strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .strip .stat { flex: 1 1 90px; }

  .txn { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .txn:last-child { border-bottom: 0; }
  .txn .d { width: 74px; flex: none; color: var(--muted); font-size: 12.5px; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-bottom: 3px;
    background: var(--chip); }
  .badge.Trade { background: var(--accent-soft); color: var(--accent); }
  .badge.Add { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .badge.Drop { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .parts { margin-top: 4px; font-size: 13px; }
  .parts div { margin-top: 2px; }
  .plink { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  .status { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--chip); }
  .status.MAX, .status.SMAX { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .status.PO, .status.TO { background: var(--accent-soft); color: var(--accent); }
  .status.HOLD { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }

  dl.bio { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
  dl.bio dt { color: var(--muted); font-size: 13px; }
  dl.bio dd { margin: 0; }

  select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .loading { color: var(--muted); padding: 18px 4px; }
  .loading::after { content: "…"; animation: dots 1.2s steps(3, end) infinite; }
  @keyframes dots { 0% { content: "."; } 33% { content: ".."; } 66% { content: "..."; } }
</style>
</head>
<body>
<div class="wrap">
  <form class="search" id="searchForm">
    <input id="q" list="names" placeholder="Search a player" autocomplete="off" autocapitalize="words">
    <datalist id="names"></datalist>
    <button type="submit">Go</button>
  </form>

  <div id="header"></div>

  <h2 class="sec">Bio</h2>
  <div id="p-bio"></div>
  <h2 class="sec">Game log</h2>
  <div id="p-log"></div>
  <h2 class="sec">Transaction history</h2>
  <div id="p-txn"></div>
  <h2 class="sec">Stats</h2>
  <div id="p-stats"></div>
  <h2 class="sec">Contract</h2>
  <div id="p-con"></div>
</div>

<script>
var START = <?!= startJson ?>;
var MODE = <?!= modeJson ?>;
</script>
<script>
/* ---------------- formatting helpers ---------------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function f1(v) { return v == null || isNaN(v) ? "—" : (Math.round(v * 10) / 10).toFixed(1); }
function f2(v) { return v == null || isNaN(v) ? "—" : (Math.round(v * 100) / 100).toFixed(2); }
function pct(v) { return v == null || isNaN(v) ? "—" : (v * 100).toFixed(1) + "%"; }
function shortDate(d) {
  var x = new Date(d); if (isNaN(x)) return "";
  return (x.getMonth() + 1) + "/" + x.getDate();
}
function longDate(d) {
  var x = new Date(d); if (isNaN(x)) return "";
  return x.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function money(s) { var n = Number(String(s).replace(/[$,]/g, "")); return isNaN(n) ? null : n; }
function stat(label, val) { return '<div class="stat"><b>' + esc(val) + "</b><span>" + esc(label) + "</span></div>"; }
function loading(msg) { return '<div class="loading">' + esc(msg || "Loading") + "</div>"; }
function box(title, inner) { return '<div class="box">' + (title ? "<h3>" + esc(title) + "</h3>" : "") + inner + "</div>"; }
function pbtn(name) { return '<button class="plink" data-player="' + esc(name) + '">' + esc(name) + "</button>"; }

/* ---------------- renderers (return HTML strings) ---------------- */
function renderHeader(c) {
  var e = c.espn || {};
  var initials = String(c.name || "?").split(" ").map(function (w) { return w[0]; }).join("").slice(0, 3);
  var img = e.img ? '<img class="shot" src="' + esc(e.img) + '" alt="">' : '<div class="shot">' + esc(initials) + "</div>";
  var meta = [c.nbaTeam, e.pos, e.jersey ? "#" + e.jersey : "", e.ht, e.wt, e.age !== "" && e.age != null ? e.age + " yrs" : ""]
    .filter(Boolean).map(esc).join(" · ");
  var chips = [];
  if (c.fantasy) chips.push('<span class="chip team">' + esc(c.fantasy.team) + (c.fantasy.owner ? " · " + esc(c.fantasy.owner) : "") + "</span>",
                            '<span class="chip">' + esc(c.fantasy.slot) + "</span>");
  else chips.push('<span class="chip">Not on a league roster</span>');
  if (e.inj) chips.push('<span class="chip inj">' + esc(e.inj.status) + "</span>");
  chips.push('<span class="chip" id="eligChip" style="display:none"></span>');
  return '<div class="hdr">' + img + "<div><h1>" + esc(c.name) + '</h1><div class="meta">' + meta +
    '</div><div class="chips">' + chips.join("") + "</div></div></div>";
}

function renderGameLog(d, seasonSel) {
  var top = '<div class="row"><div class="muted small">' + esc(d && d.season ? d.season + " season" : "") + "</div>" + seasonSel + "</div>";
  if (!d || !d.ok) return top + box("", '<div class="err">' + esc(d && d.msg || "Couldn't load the game log.") + "</div>");
  if (!d.rows.length) return top + box("", '<div class="muted">No games yet this season.</div>');
  var s = d.summary;
  var strip = s ? '<div class="strip">' + stat("FPPG", f1(s.avg.fp)) + stat("Last 5", f1(s.adv.last5)) +
    stat("Last 10", f1(s.adv.last10)) + stat("High", f1(s.adv.high)) + stat("Games", s.g) + "</div>" : "";
  var head = "<tr><th>Date</th><th>Opp</th><th>Res</th><th>FP</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th>" +
             "<th>STL</th><th>BLK</th><th>TO</th><th>FG</th><th>3PT</th><th>FT</th><th>PF</th></tr>";
  var shown = state.allGames ? d.rows : d.rows.slice(0, 10);
  var body = shown.map(function (g) {
    var tag = g.type === "RS" ? "" : '<span class="tag">' + esc(g.type) + "</span>";
    return "<tr><td>" + esc(shortDate(g.date)) + tag + '</td><td class="l">' + esc((g.at === "@" ? "@ " : "vs ") + g.opp) +
      '</td><td class="l"><span class="res-' + esc(g.res) + '">' + esc(g.res) + "</span> " + esc(g.score) +
      '</td><td class="fp">' + f1(g.fp) + "</td><td>" + g.min + "</td><td>" + g.pts + "</td><td>" + g.reb + "</td><td>" + g.ast +
      "</td><td>" + g.stl + "</td><td>" + g.blk + "</td><td>" + g.to + "</td><td>" + g.fgm + "-" + g.fga +
      "</td><td>" + g.fg3m + "-" + g.fg3a + "</td><td>" + g.ftm + "-" + g.fta + "</td><td>" + g.pf + "</td></tr>";
  }).join("");
  var foot = d.unscored && d.unscored.length
    ? '<p class="muted small">FP leaves out these league scoring settings (not in the box score): ' + esc(d.unscored.join(", ")) + "</p>"
    : '<p class="muted small">FP = fantasy points under your league\'s scoring.</p>';
  var more = d.rows.length > 10
    ? '<button class="more" id="moreGames">' + (state.allGames ? "Show last 10 only" : "Show all " + d.rows.length + " games") + "</button>" : "";
  return top + strip + '<div class="tbl"><table>' + head + body + "</table></div>" + more + foot;
}

function renderTxns(d) {
  if (!d || !d.ok) return box("", '<div class="muted">' + esc(d && d.msg || "Couldn't load transactions.") + "</div>");
  if (!d.rows.length) return box("", '<div class="muted">No league transactions for this player.</div>');
  var html = d.rows.map(function (t) {
    var kind = /Trade/.test(t.type) ? "Trade" : /Add/.test(t.type) ? "Add" : /Drop/.test(t.type) ? "Drop" : "";
    var parts = (t.parts || []).map(function (p) {
      var items = p.items.length ? p.items.map(function (it) { return it.player ? pbtn(it.player) : esc(it.pick); }).join(", ") : "nothing";
      return "<div><b>" + esc(p.team) + "</b> gets: " + items + "</div>";
    }).join("");
    return '<div class="txn"><div class="d">' + esc(longDate(t.ts)) + "</div><div>" +
      '<span class="badge ' + kind + '">' + esc(t.type) + "</span> <span class=\"muted small\">" + esc(t.season ? t.season + " season" : "") + "</span>" +
      "<div>" + esc(t.text) + "</div>" + (parts ? '<div class="parts">' + parts + "</div>" : "") + "</div></div>";
  }).join("");
  return box("", html);
}

function renderContract(c) {
  if (!c.contracts || !c.contracts.length) return box("", '<div class="muted">Not on the Master list.</div>');
  return c.contracts.map(function (k) {
    var first = money(k.years[0] && k.years[0].salary);
    var total = k.years.reduce(function (s, y) { var m = money(y.salary); return s + (m || 0); }, 0);
    var yrs = k.years.filter(function (y) { return money(y.salary) != null; }).length;
    var end = k.years.filter(function (y) { return /^(UFA|RFA)$/i.test(y.salary.trim()); })[0];
    var rows = k.years.filter(function (y) { return y.salary || y.status; }).map(function (y) {
      return "<tr><td>" + esc(y.season) + "</td><td>" + esc(y.salary) + "</td><td>" +
        (y.status ? '<span class="status ' + esc(y.status) + '">' + esc(y.status) + "</span>" : "") + "</td></tr>";
    }).join("");
    var summary = '<div class="strip">' +
      stat(c.seasons[0] || "This year", first != null ? "$" + first.toFixed(1) + "M" : "—") +
      stat("% of $" + c.cap + "M cap", first != null ? pct(first / c.cap) : "—") +
      stat("Years left", yrs) +
      stat("Total", "$" + total.toFixed(1) + "M") +
      stat("Becomes", end ? end.salary + " " + end.season : "—") + "</div>";
    var title = k.hold ? "Cap hold" : "Contract";
    return box(title + (k.team ? " · " + k.team : ""),
      summary + '<div class="tbl"><table><tr><th>Season</th><th>Salary</th><th>Status</th></tr>' + rows + "</table></div>" +
      (k.details ? '<p class="small"><b>Details:</b> ' + esc(k.details) + "</p>" : "") +
      '<p class="muted small">Master list row ' + k.row + (k.onRoster !== "" ? " · on " + esc(k.onRoster) + " roster(s)" : "") + "</p>");
  }).join("");
}

function renderBio(c) {
  var e = c.espn || {};
  var bio = [
    ["Team", c.nbaTeam], ["Position", e.pos], ["Jersey", e.jersey ? "#" + e.jersey : ""], ["Height", e.ht], ["Weight", e.wt],
    ["Age", e.age], ["Born", [e.dob ? longDate(e.dob) : "", e.born].filter(Boolean).join(" · ")],
    ["College", e.college], ["Experience", e.exp !== "" && e.exp != null ? e.exp + (e.exp === 1 ? " year" : " years") : ""],
    ["Injury", e.inj ? e.inj.status + (e.inj.date ? " (" + longDate(e.inj.date) + ")" : "") : "None listed"],
  ].filter(function (r) { return r[1] !== "" && r[1] != null; })
   .map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>"; }).join("");
  return box("", '<dl class="bio">' + bio + "</dl>" + (c.espn ? "" : '<p class="muted small">No ESPN match, so bio is limited.</p>'));
}

function renderStats(c, d) {
  if (!d) return box("", loading("Loading stats"));
  if (!d.ok || !d.summary) return box("", '<div class="muted">' + esc(d.msg || "No regular-season games yet.") + "</div>");
  var s = d.summary;
  var avg = box((d.season || "") + " averages · " + s.g + " games",
    '<div class="grid">' + stat("FPPG", f1(s.avg.fp)) + stat("MIN", f1(s.avg.min)) + stat("PTS", f1(s.avg.pts)) +
    stat("REB", f1(s.avg.reb)) + stat("AST", f1(s.avg.ast)) + stat("STL", f1(s.avg.stl)) + stat("BLK", f1(s.avg.blk)) +
    stat("TO", f1(s.avg.to)) + stat("3PM", f1(s.avg.fg3m)) + stat("FG%", pct(s.pct.fg)) + stat("3P%", pct(s.pct.fg3)) +
    stat("FT%", pct(s.pct.ft)) + "</div>");
  var adv = box("Advanced",
    '<div class="grid">' + stat("TS%", pct(s.adv.ts)) + stat("eFG%", pct(s.adv.efg)) + stat("3PA rate", pct(s.adv.par3)) +
    stat("FT rate", pct(s.adv.ftr)) + stat("AST/TO", f2(s.adv.astTo)) + stat("FP / min", f2(s.adv.fpMin)) +
    stat("FP std dev", f1(s.adv.fpSd)) + stat("FP high", f1(s.adv.high)) + stat("FP low", f1(s.adv.low)) +
    stat("Double-doubles", s.adv.dd) + stat("Triple-doubles", s.adv.td) + "</div>" +
    '<p class="muted small">Calculated from the box scores. Usage rate and on/off numbers need team-level data and aren\'t included.</p>');
  var p36 = box("Per 36 minutes",
    '<div class="grid">' + stat("FP", f1(s.per36.fp)) + stat("PTS", f1(s.per36.pts)) + stat("REB", f1(s.per36.reb)) +
    stat("AST", f1(s.per36.ast)) + stat("STL", f1(s.per36.stl)) + stat("BLK", f1(s.per36.blk)) + "</div>");
  var po = d.playoffs ? box("Playoffs · " + d.playoffs.g + " games",
    '<div class="grid">' + stat("FPPG", f1(d.playoffs.avg.fp)) + stat("PTS", f1(d.playoffs.avg.pts)) +
    stat("REB", f1(d.playoffs.avg.reb)) + stat("AST", f1(d.playoffs.avg.ast)) + "</div>") : "";
  return avg + adv + p36 + po;
}

/* ---------------- page state ---------------- */
var state = { card: null, log: null, season: "", allGames: false };
var current = "";

function $(id) { return document.getElementById(id); }

function seasonSelect() {
  var y = new Date().getFullYear() + (new Date().getMonth() >= 8 ? 1 : 0); // ESPN season = end year
  var opts = [["", "This season"], [String(y - 1), (y - 2) + "-" + String(y - 1).slice(2)], [String(y - 2), (y - 3) + "-" + String(y - 2).slice(2)]];
  return '<select id="seasonSel">' + opts.map(function (o) {
    return '<option value="' + o[0] + '"' + (o[0] === state.season ? " selected" : "") + ">" + o[1] + "</option>";
  }).join("") + "</select>";
}

function showTab() {} // single page now; kept so older calls are harmless

function fail(where) {
  return function (err) { $(where).innerHTML = box("", '<div class="err">Something went wrong: ' + esc(err && err.message || err) + "</div>"); };
}

function loadPlayer(name, push) {
  name = String(name || "").trim();
  if (!name) { $("header").innerHTML = box("", '<div class="muted">Search for a player, or open this page from a player name in the sheet.</div>'); return; }
  $("q").value = name;
  state = { card: null, log: null, season: "", allGames: false };
  $("header").innerHTML = box("", loading("Loading " + name));
  ["p-bio", "p-log", "p-txn", "p-stats", "p-con"].forEach(function (id) { $(id).innerHTML = loading(); });
  current = name;
  if (push && MODE === "page" && window.google && google.script && google.script.history) google.script.history.push({ n: name }, { n: name });
  document.title = name + " · Player card";

  google.script.run.withSuccessHandler(function (c) {
    state.card = c;
    if (!c.found) {
      $("header").innerHTML = box("", "Couldn't find <b>" + esc(c.query) + "</b> on Sleeper, ESPN, or the Master list.");
      ["p-bio", "p-log", "p-txn", "p-stats", "p-con"].forEach(function (id) { $(id).innerHTML = ""; });
      return;
    }
    $("header").innerHTML = renderHeader(c);
    $("p-bio").innerHTML = renderBio(c);
    $("p-con").innerHTML = renderContract(c);
    $("p-stats").innerHTML = renderStats(c, null);
    loadLog();
    google.script.run.withSuccessHandler(function (t) { $("p-txn").innerHTML = renderTxns(t); })
      .withFailureHandler(fail("p-txn")).getTxns(c.sleeperId);
  }).withFailureHandler(fail("header")).getCard(name);
}

function loadLog() {
  var c = state.card;
  $("p-log").innerHTML = loading("Loading games");
  var want = state.season;
  google.script.run.withSuccessHandler(function (d) {
    if (state.card !== c || state.season !== want) return; // player or season changed meanwhile
    state.log = d;
    $("p-log").innerHTML = renderGameLog(d, seasonSelect());
    $("p-stats").innerHTML = renderStats(c, d);
    var chip = $("eligChip");
    if (chip && d && d.summary && d.summary.eligibility && !want) {
      chip.textContent = d.summary.eligibility; chip.className = "chip elig"; chip.style.display = "";
    }
  }).withFailureHandler(fail("p-log")).getGameLog(c.espn && c.espn.id, want);
}

/* ---------------- events ---------------- */
document.addEventListener("click", function (ev) {
  var t = ev.target.closest ? ev.target.closest(".plink, #moreGames") : null;
  if (!t) return;
  if (t.id === "moreGames") {
    state.allGames = !state.allGames;
    $("p-log").innerHTML = renderGameLog(state.log, seasonSelect());
  } else { loadPlayer(t.dataset.player, true); window.scrollTo(0, 0); }
});
document.addEventListener("change", function (ev) {
  if (ev.target.id === "seasonSel") { state.season = ev.target.value; loadLog(); }
});
$("searchForm").addEventListener("submit", function (ev) {
  ev.preventDefault();
  $("q").blur();
  showTab("log");
  loadPlayer($("q").value, true);
});

if (window.google && google.script) {
  if (google.script.history) google.script.history.setChangeHandler(function (e) {
    var n = e.state && e.state.n || (e.location && e.location.parameter && e.location.parameter.n);
    if (n) loadPlayer(n, false);
  });
  google.script.run.withSuccessHandler(function (names) {
    $("names").innerHTML = names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join("");
  }).getPlayerIndex();
  if (MODE === "popup") {
    document.body.classList.add("popup");
    if (START) loadPlayer(START, false);
    else $("header").innerHTML = box("", '<div class="muted">Click a player name in the sheet. This window follows your clicks while it\'s open.</div>');
    // Follow the selected cell in the sheet
    var lastKey = null, busy = false;
    setInterval(function () {
      if (busy || document.hidden) return;
      busy = true;
      google.script.run.withSuccessHandler(function (sel) {
        busy = false;
        if (!sel || sel.key === lastKey) return;
        lastKey = sel.key;
        if (sel.name && sel.name !== current) { showTab("log"); loadPlayer(sel.name, false); window.scrollTo(0, 0); }
      }).withFailureHandler(function () { busy = false; }).getSelectedPlayer();
    }, 900);
  } else {
    loadPlayer(START, false);
  }
}
</script>
</body>
</html>
